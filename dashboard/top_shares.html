<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Shares Data - OI Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #101622; color: #f1f5f9; height: 100vh; overflow: hidden; }
        .dashboard { display: flex; height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 256px; background: #101622; border-right: 1px solid #1e293b; display: flex; flex-direction: column; transition: all 0.3s ease; }
        .sidebar.collapsed { width: 64px; }
        .sidebar.collapsed .logo-text, .sidebar.collapsed .nav-link span, .sidebar.collapsed .section-header { display: none; }
        .sidebar.collapsed .nav-link { justify-content: center; padding: 8px; }
        .sidebar-header { padding: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .logo-container { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .sidebar-toggle { width: 32px; height: 32px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .sidebar-toggle:hover { background: #334155; color: #135bec; border-color: #135bec; }
        .sidebar-toggle svg { transition: transform 0.3s; }
        .sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
        .logo-icon { width: 30px; height: 30px; background: #135bec; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 6px; }
        .logo-text { font-size: 18px; font-weight: 700; color: #f1f5f9; }
        .nav-menu { flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 4px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; text-decoration: none; color: #94a3b8; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .nav-link:hover { background: #135bec1a; color: #135bec; }
        .nav-link.active { background: #135bec1a; color: #135bec; }
        .section-header { padding: 16px 12px 8px; font-size: 12px; font-weight: 600; color: #94a3b8; letter-spacing: 0.6px; text-transform: uppercase; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; }

        /* MAIN */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header-bar { height: 64px; background: #101622; border-bottom: 1px solid #1e293b; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .hamburger-btn { display: none; background: none; border: none; color: #94a3b8; cursor: pointer; padding: 4px; }
        .content-area { flex: 1; overflow-y: auto; padding: 24px; }

        /* TOP INFO BAR */
        .info-bar { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .info-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; min-width: 200px; }
        .info-card-label { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-card-value { font-size: 20px; font-weight: 700; color: #f1f5f9; font-family: 'Roboto Mono', monospace; }
        .info-card-change { font-size: 13px; font-weight: 600; font-family: 'Roboto Mono', monospace; }
        .positive { color: #10b981; }
        .negative { color: #f43f5e; }
        .neutral { color: #94a3b8; }

        /* DATE PICKER */
        .date-picker-container { position: relative; }
        .date-picker-input { display: flex; align-items: center; gap: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: #f1f5f9; transition: all 0.2s; }
        .date-picker-input:hover { border-color: #135bec; }
        .calendar-dropdown { position: absolute; top: calc(100% + 8px); right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; z-index: 1000; min-width: 320px; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .calendar-dropdown.show { display: block; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .calendar-title { font-size: 14px; font-weight: 700; color: #f1f5f9; }
        .month-navigation { display: flex; align-items: center; gap: 8px; }
        .month-nav-btn { background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .month-nav-btn:hover { background: #334155; color: #135bec; }
        .month-display { font-size: 13px; font-weight: 600; color: #f1f5f9; min-width: 100px; text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day-header { text-align: center; font-size: 11px; font-weight: 600; color: #64748b; padding: 4px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: #0f172a; border: 1px solid #1e293b; color: #64748b; }
        .calendar-day.available { background: #10b9811a; border-color: #10b98133; color: #10b981; }
        .calendar-day.selected { background: #135bec !important; border-color: #135bec !important; color: white !important; transform: scale(1.1); }
        .calendar-day.today { border-color: #f59e0b; color: #f59e0b; }
        .calendar-day.unavailable { opacity: 0.3; cursor: not-allowed; }

        /* MODE BADGE */
        .mode-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .mode-badge.live { background: #10b98120; color: #10b981; border: 1px solid #10b98140; }
        .mode-badge.historical { background: #135bec20; color: #60a5fa; border: 1px solid #135bec40; }

        /* SECTION TITLE */
        .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .section-title h2 { font-size: 16px; font-weight: 700; color: #f1f5f9; }
        .section-title .subtitle { font-size: 12px; color: #64748b; }

        /* TIME SELECTORS (historical mode) */
        .time-selectors { display: none; margin-bottom: 16px; gap: 12px; align-items: center; flex-wrap: wrap; }
        .time-selectors.show { display: flex; }
        .time-select { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 6px 10px; color: #f1f5f9; font-size: 13px; font-family: 'Roboto Mono', monospace; cursor: pointer; }
        .time-select:focus { outline: none; border-color: #135bec; }
        .time-select-label { font-size: 12px; color: #94a3b8; font-weight: 600; }
        .btn-apply { background: #135bec; color: white; border: none; border-radius: 8px; padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-apply:hover { background: #1d4ed8; }

        /* LIVE TABLE */
        .shares-table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid #1e293b; }
        .shares-table { width: 100%; border-collapse: collapse; min-width: 700px; }
        .shares-table th { background: #0f172a; padding: 10px 14px; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; border-bottom: 1px solid #1e293b; white-space: nowrap; }
        .shares-table th.time-header { text-align: center; background: #0f172a; border-left: 1px solid #1e293b; }
        .shares-table th.time-group { text-align: center; background: #135bec0d; color: #60a5fa; font-size: 12px; border-left: 1px solid #1e293b; padding: 6px; }
        .shares-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #1e293b10; white-space: nowrap; }
        .shares-table tbody tr { transition: background 0.15s; }
        .shares-table tbody tr:hover { background: #1e293b40; }
        .shares-table .company-name { font-weight: 600; color: #f1f5f9; }
        .shares-table .company-ticker { font-size: 11px; color: #64748b; font-weight: 500; }
        .shares-table .ltp-cell { text-align: right; font-family: 'Roboto Mono', monospace; font-weight: 600; color: #f1f5f9; border-left: 1px solid #1e293b; }
        .shares-table .chg-cell { text-align: right; font-family: 'Roboto Mono', monospace; font-weight: 600; font-size: 12px; }
        .shares-table .fetched-cell { font-family: 'Roboto Mono', monospace; font-size: 12px; color: #64748b; text-align: center; }

        /* SCROLLABLE HISTORY PANEL */
        .history-panel { margin-top: 24px; }
        .history-panel h3 { font-size: 14px; font-weight: 700; color: #94a3b8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .history-table-wrapper { max-height: 400px; overflow-y: auto; border-radius: 12px; border: 1px solid #1e293b; }
        .history-table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .history-table thead { position: sticky; top: 0; z-index: 2; }
        .history-table th { background: #0f172a; padding: 8px 12px; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; text-align: right; border-bottom: 1px solid #1e293b; white-space: nowrap; }
        .history-table th:first-child { text-align: center; }
        .history-table td { padding: 6px 12px; font-size: 12px; border-bottom: 1px solid #1e293b10; font-family: 'Roboto Mono', monospace; text-align: right; color: #cbd5e1; }
        .history-table td:first-child { text-align: center; color: #64748b; }
        .history-table tbody tr { transition: background 0.15s; }
        .history-table tbody tr:hover { background: #1e293b40; }

        /* Scrollbar styling */
        .history-table-wrapper::-webkit-scrollbar { width: 6px; }
        .history-table-wrapper::-webkit-scrollbar-track { background: #0f172a; }
        .history-table-wrapper::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .history-table-wrapper::-webkit-scrollbar-thumb:hover { background: #475569; }
        .content-area::-webkit-scrollbar { width: 6px; }
        .content-area::-webkit-scrollbar-track { background: #0f172a; }
        .content-area::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        /* LOADING */
        .loading-msg { text-align: center; padding: 48px; color: #64748b; font-size: 14px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #1e293b; border-top-color: #135bec; border-radius: 50%; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* TOAST */
        .toast-error { position: fixed; bottom: 24px; right: 24px; z-index: 10000; background: #1e293b; border: 1px solid #ef4444; border-radius: 8px; padding: 12px 20px; color: #f87171; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .sidebar { width: 64px; }
            .sidebar .logo-text, .sidebar .nav-link span, .sidebar .section-header { display: none; }
            .sidebar .nav-link { justify-content: center; padding: 8px; }
        }
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; left: -256px; width: 256px; height: 100vh; z-index: 999; transition: left 0.3s ease; }
            .sidebar.mobile-open { left: 0; }
            .sidebar.mobile-open ~ .sidebar-overlay { display: block; }
            .sidebar .logo-text, .sidebar .nav-link span, .sidebar .section-header { display: revert; }
            .sidebar .nav-link { justify-content: flex-start; padding: 8px 12px; }
            .hamburger-btn { display: flex; }
            .header-bar { padding: 0 12px; }
            .content-area { padding: 12px; }
            .info-card { min-width: 140px; padding: 12px; }
            .info-card-value { font-size: 16px; }
        }
        @media (max-width: 480px) {
            .content-area { padding: 8px; }
            .info-card { flex: 1 1 100%; }
            .calendar-dropdown { min-width: calc(100vw - 16px); right: -60px; }
        }
    </style>
</head>

    <script>
        // Share config (matches backend TOP_SHARES)
        const SHARES = [
            { prefix: 'nifty_50', name: 'Nifty 50', ticker: 'INDEX' },
            { prefix: 'india_vix', name: 'India VIX', ticker: 'INDEX' },
            { prefix: 'reliance', name: 'Reliance Industries', ticker: 'NSE: RELIANCE' },
            { prefix: 'hdfc_bank', name: 'HDFC Bank', ticker: 'NSE: HDFCBANK' },
            { prefix: 'icici_bank', name: 'ICICI Bank', ticker: 'NSE: ICICIBANK' },
            { prefix: 'infosys', name: 'Infosys', ticker: 'NSE: INFY' },
            { prefix: 'tcs', name: 'TCS', ticker: 'NSE: TCS' },
            { prefix: 'itc', name: 'ITC', ticker: 'NSE: ITC' },
            { prefix: 'lt', name: 'L&T', ticker: 'NSE: LT' },
        ];

        let isLive = true;
        let selectedDate = null;    // null = today (live)
        let availableDates = [];
        let availableTimes = [];
        let refreshTimer = null;
        let calendarMonth = new Date();

        // ── Helpers ──
        function fmtNum(v) {
            if (v == null) return '--';
            return Number(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function chgClass(v) {
            if (v > 0) return 'positive';
            if (v < 0) return 'negative';
            return 'neutral';
        }
        function chgStr(v) {
            if (v == null) return '--';
            const s = v > 0 ? '+' : '';
            return s + Number(v).toFixed(2);
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast-error';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // ── Render main 3-snapshot table ──
        function renderSnapshots(snapshots) {
            const thead = document.getElementById('shares-thead');
            const tbody = document.getElementById('shares-tbody');
            const loading = document.getElementById('table-loading');

            if (!snapshots || snapshots.length === 0) {
                loading.innerHTML = 'No data available for this date.';
                loading.style.display = '';
                thead.innerHTML = '';
                tbody.innerHTML = '';
                return;
            }
            loading.style.display = 'none';

            // Build header: Company | Time1 LTP | Chg | Time2 LTP | Chg | Time3 LTP | Chg
            let hdr1 = '<tr><th rowspan="2" style="min-width:180px">Company</th>';
            let hdr2 = '<tr>';
            for (const snap of snapshots) {
                hdr1 += `<th class="time-group" colspan="2">@ ${snap.timestamp}</th>`;
                hdr2 += '<th class="time-header">LTP</th><th class="time-header">Chg</th>';
            }
            hdr1 += '</tr>';
            hdr2 += '</tr>';
            thead.innerHTML = hdr1 + hdr2;

            // Build body rows — one per share
            let html = '';
            if (snapshots.length > 0) {
                const numShares = snapshots[0].shares.length;
                for (let i = 0; i < numShares; i++) {
                    const s = snapshots[0].shares[i];
                    html += '<tr>';
                    html += `<td><div class="company-name">${s.name}</div><div class="company-ticker">${s.ticker}</div></td>`;
                    for (const snap of snapshots) {
                        const d = snap.shares[i];
                        html += `<td class="ltp-cell">${fmtNum(d.ltp)}</td>`;
                        html += `<td class="chg-cell ${chgClass(d.chg)}">${chgStr(d.chg)}</td>`;
                    }
                    html += '</tr>';
                }
            }
            tbody.innerHTML = html;

            // Update info cards from latest snapshot
            const latest = snapshots[snapshots.length - 1];
            if (latest) {
                const nifty = latest.shares.find(s => s.prefix === 'nifty_50');
                const vix = latest.shares.find(s => s.prefix === 'india_vix');
                if (nifty) {
                    document.getElementById('nifty-ltp').textContent = fmtNum(nifty.ltp);
                    const nChg = document.getElementById('nifty-chg');
                    nChg.textContent = chgStr(nifty.chg);
                    nChg.className = 'info-card-change ' + chgClass(nifty.chg);
                }
                if (vix) {
                    document.getElementById('vix-ltp').textContent = fmtNum(vix.ltp);
                    const vChg = document.getElementById('vix-chg');
                    vChg.textContent = chgStr(vix.chg);
                    vChg.className = 'info-card-change ' + chgClass(vix.chg);
                }
            }
        }

        // ── Render scrollable history table ──
        function renderHistory(history) {
            const thead = document.getElementById('history-thead');
            const tbody = document.getElementById('history-tbody');
            const panel = document.getElementById('history-panel');

            if (!history || history.length === 0) {
                panel.style.display = 'none';
                return;
            }
            panel.style.display = '';

            // Header: Time | Share1 LTP | Share2 LTP | ...
            let hdr = '<tr><th style="text-align:center">Time</th>';
            for (const s of SHARES) {
                hdr += `<th>${s.name}</th>`;
            }
            hdr += '</tr>';
            thead.innerHTML = hdr;

            // Rows — newest at top
            let html = '';
            for (let r = history.length - 1; r >= 0; r--) {
                const snap = history[r];
                html += `<tr><td>${snap.timestamp}</td>`;
                for (const s of snap.shares) {
                    const cls = chgClass(s.chg);
                    html += `<td class="${cls}">${fmtNum(s.ltp)}</td>`;
                }
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }

        // ── Data fetching ──
        async function fetchLive() {
            try {
                const res = await fetch('/api/top-shares/live');
                const data = await res.json();
                if (data.status !== 'success') throw new Error(data.message);
                renderSnapshots(data.snapshots);
                renderHistory(data.history);
                document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString('en-IN');
            } catch (e) {
                console.error('Live fetch error:', e);
            }
        }

        async function loadHistorical() {
            if (!selectedDate) return;
            const t1 = document.getElementById('time-sel-1').value;
            const t2 = document.getElementById('time-sel-2').value;
            const t3 = document.getElementById('time-sel-3').value;
            const loading = document.getElementById('table-loading');
            loading.innerHTML = '<span class="spinner"></span> Loading data...';
            loading.style.display = '';

            try {
                let url = `/api/top-shares/historical?date=${selectedDate}`;
                if (t1 && t2 && t3) {
                    url += `&t1=${t1}&t2=${t2}&t3=${t3}`;
                }
                const res = await fetch(url);
                const data = await res.json();
                if (data.status !== 'success') throw new Error(data.message);

                if (t1 && t2 && t3) {
                    // Show selected 3 snapshots
                    renderSnapshots(data.snapshots);
                } else {
                    // Full day — show last 3 as snapshots, rest as history
                    const snaps = data.snapshots;
                    const top3 = snaps.length > 3 ? snaps.slice(-3) : snaps;
                    renderSnapshots(top3);
                    renderHistory(snaps);
                }
                document.getElementById('last-updated').textContent = `Showing: ${selectedDate}`;
            } catch (e) {
                showToast('Failed to load historical data: ' + e.message);
                loading.innerHTML = 'Failed to load data.';
            }
        }

        async function loadAvailableTimes(date) {
            try {
                const res = await fetch(`/api/top-shares/available-times?date=${date}`);
                const data = await res.json();
                if (data.status !== 'success') return;
                availableTimes = data.times;
                populateTimeSelectors();
            } catch (e) {
                console.error('Available times error:', e);
            }
        }

        function populateTimeSelectors() {
            const ids = ['time-sel-1', 'time-sel-2', 'time-sel-3'];
            for (let i = 0; i < 3; i++) {
                const sel = document.getElementById(ids[i]);
                sel.innerHTML = '';
                for (const t of availableTimes) {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    sel.appendChild(opt);
                }
                // Default: pick 3 evenly spaced times
                if (availableTimes.length >= 3) {
                    const idx = Math.floor((i / 2) * (availableTimes.length - 1));
                    sel.selectedIndex = idx;
                }
            }
        }

        // ── Mode switching ──
        function setLiveMode() {
            isLive = true;
            selectedDate = null;
            document.getElementById('mode-badge').textContent = 'LIVE';
            document.getElementById('mode-badge').className = 'mode-badge live';
            document.getElementById('selected-date-text').textContent = 'Today';
            document.getElementById('table-subtitle').textContent = 'Live Market Feed';
            document.getElementById('time-selectors').classList.remove('show');
            document.getElementById('history-panel').style.display = '';
            startAutoRefresh();
            fetchLive();
        }

        function setHistoricalMode(date) {
            isLive = false;
            selectedDate = date;
            stopAutoRefresh();
            document.getElementById('mode-badge').textContent = 'HISTORICAL';
            document.getElementById('mode-badge').className = 'mode-badge historical';
            document.getElementById('selected-date-text').textContent = date;
            document.getElementById('table-subtitle').textContent = `Historical Data — ${date}`;
            document.getElementById('time-selectors').classList.add('show');
            document.getElementById('history-panel').style.display = 'none';
            loadAvailableTimes(date);
            // Load full day initially (no specific times)
            loadHistorical();
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            refreshTimer = setInterval(fetchLive, 5000);
        }
        function stopAutoRefresh() {
            if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        }

        // ── Calendar ──
        async function loadAvailableDates() {
            try {
                const res = await fetch('/api/top-shares/available-dates');
                const data = await res.json();
                if (data.status === 'success') {
                    availableDates = data.dates;
                }
            } catch (e) {
                console.error('Available dates error:', e);
            }
            renderCalendar();
        }

        function toggleCalendar() {
            document.getElementById('calendar-dropdown').classList.toggle('show');
        }

        function prevMonth() {
            calendarMonth.setMonth(calendarMonth.getMonth() - 1);
            renderCalendar();
        }
        function nextMonth() {
            calendarMonth.setMonth(calendarMonth.getMonth() + 1);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const display = document.getElementById('month-display');
            const year = calendarMonth.getFullYear();
            const month = calendarMonth.getMonth();
            display.textContent = calendarMonth.toLocaleString('en-IN', { month: 'long', year: 'numeric' });

            const todayStr = new Date().toISOString().slice(0, 10);
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();

            let html = '';
            ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(d => {
                html += `<div class="calendar-day-header">${d}</div>`;
            });
            for (let i = 0; i < firstDay; i++) {
                html += '<div></div>';
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isAvail = availableDates.includes(ds);
                const isToday = ds === todayStr;
                const isSel = ds === selectedDate;
                let cls = 'calendar-day';
                if (isSel) cls += ' selected';
                else if (isToday) cls += ' today available';
                else if (isAvail) cls += ' available';
                else cls += ' unavailable';

                const onclick = (isAvail || isToday) ? `onclick="selectDate('${ds}')"` : '';
                html += `<div class="${cls}" ${onclick}>${d}</div>`;
            }
            grid.innerHTML = html;
        }

        function selectDate(ds) {
            const todayStr = new Date().toISOString().slice(0, 10);
            document.getElementById('calendar-dropdown').classList.remove('show');
            if (ds === todayStr) {
                setLiveMode();
            } else {
                setHistoricalMode(ds);
            }
            renderCalendar();
        }

        // Close calendar on outside click
        document.addEventListener('click', (e) => {
            const cal = document.getElementById('calendar-dropdown');
            const picker = document.querySelector('.date-picker-container');
            if (cal.classList.contains('show') && !picker.contains(e.target)) {
                cal.classList.remove('show');
            }
        });

        // ── Sidebar ──
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sb.classList.contains('collapsed'));
        }
        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }
        function closeMobileSidebar() {
            document.getElementById('sidebar').classList.remove('mobile-open');
        }
        function initSidebar() {
            if (localStorage.getItem('sidebarCollapsed') === 'true') {
                document.getElementById('sidebar').classList.add('collapsed');
            }
        }

        // ── Init ──
        initSidebar();
        loadAvailableDates();
        fetchLive();
        startAutoRefresh();
    </script>
</body>
</html>
